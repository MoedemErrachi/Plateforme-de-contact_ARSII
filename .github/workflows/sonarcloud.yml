name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            base-dir: backend
            working-directory: backend
          - name: frontend
            base-dir: frontend
            working-directory: frontend
          - name: chatbot-service
            base-dir: chatbot-service
            working-directory: chatbot-service
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        if: matrix.name == 'chatbot-service'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install chatbot dependencies
        if: matrix.name == 'chatbot-service'
        working-directory: chatbot-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run chatbot tests with coverage
        if: matrix.name == 'chatbot-service'
        working-directory: chatbot-service
        run: python -m pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term

      - name: Set up Node.js
        if: matrix.name != 'chatbot-service'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: matrix.name != 'chatbot-service'
        working-directory: ${{ matrix.working-directory }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Prisma client
        if: matrix.name == 'backend'
        working-directory: backend
        run: npx prisma generate

      - name: Run tests with coverage
        if: matrix.name == 'backend' || matrix.name == 'frontend'
        working-directory: ${{ matrix.working-directory }}
        run: npm run test:coverage

      - name: Typecheck
        if: matrix.name != 'chatbot-service'
        working-directory: ${{ matrix.working-directory }}
        run: npm run lint

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          projectBaseDir: ${{ matrix.base-dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
