services:
  - type: web
    name: arsii-chatbot
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: chatbot-service
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # ── Backend connection ──
      # sync: false — set in the Render dashboard (e.g. https://<backend>.onrender.com).
      - key: MAIN_API_BASE_URL
        sync: false
      # ── Security ──
      - key: JWT_SECRET
        sync: false # must match backend JWT_SECRET exactly
      # ── Frontend CORS ──
      # sync: false — set in the Render dashboard (e.g. https://<frontend>.vercel.app).
      - key: FRONTEND_ORIGINS
        sync: false
      # ── LLM Providers ──
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-2603
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      # ── Session / Limits ──
      - key: SESSION_TTL_SECONDS
        value: "3600"
      - key: SESSION_MAX_MESSAGES
        value: "10"
      - key: CHATBOT_RATE_LIMIT
        value: 20/minute
      - key: OCR_RATE_LIMIT
        value: 10/minute # OCR endpoint (optional — has an in-code default)
      - key: MAX_TOOL_ROUNDS
        value: "3"
